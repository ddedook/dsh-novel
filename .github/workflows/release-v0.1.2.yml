name: Create Release v0.1.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          name: v0.1.2
          body: |
            ## 变更

            - 支持 DeepSeek Harness 0.2.1-rc.3（cordis 4.0.5）：去掉已停更的 `dsh-client-runtime`，客户端改用 cordis `Context` + slots。
            - Host：`JsonValue` 改从 `dsh-util-values`；工具 cwd 读 `agent.session.header.cwd`。
            - 客户端：适配 `ConvViewProps` / 图标 Medium 命名，以及 `MarkdownText` 的 `labels`。

            ## 安装

            ```bash
            npm install dsh-novel@0.1.2
            ```

            完整说明见 [CHANGELOG.md](https://github.com/ddedook/dsh-novel/blob/v0.1.2/CHANGELOG.md)。
          draft: false
          prerelease: false
          make_latest: true
