name: Create Release v0.1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3
          name: v0.1.3
          body: |
            ## 变更

            - 修复工具执行崩溃 `Cannot read properties of undefined (reading 'prepare')`：宿主包改为 `peerDependencies`，避免 profile 再装一份 `dsh-tools` 导致 `TOOL_RUNTIME_SCHEDULER` Symbol 不一致。

            ## 安装

            ```bash
            npm install dsh-novel@0.1.3
            ```

            完整说明见 [CHANGELOG.md](https://github.com/ddedook/dsh-novel/blob/v0.1.3/CHANGELOG.md)。
          draft: false
          prerelease: false
          make_latest: true
